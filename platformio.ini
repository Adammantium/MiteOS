; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
framework = espidf, arduino
platform_packages = 
	framework-arduino @ https://github.com/espressif/arduino-esp32/archive/refs/tags/3.1.0.zip
lib_ldf_mode = chain
lib_deps = 
	gurusr/SmallRTC@^2.4.7
	lucadentella/TOTP library@^1.1.0
	zinggjm/GxEPD2@^1.6.2
	tzapu/WiFiManager@^2.0.17
	arduino-libraries/NTPClient@^3.2.1
	bblanchon/ArduinoJson@^7.2.2
	h2zero/NimBLE-Arduino@^2.5.0
	https://github.com/lewisxhe/BMA423_Library
	https://github.com/arduino-libraries/Arduino_JSON.git
	https://github.com/dirkx/Arduino-Base32-Decode

build_flags = 
	-Wno-deprecated-declarations
	-Wno-maybe-uninitialized
	-fno-if-conversion
	-Wno-format
	-Wno-stringop-truncation
	-Wno-unused-value
	-Wno-use-after-free
	-Wno-unused-variable
	-Wno-unused-function
    -Os
    -DUSE_NIMBLE=TRUE
	-DCONFIG_BT_NIMBLE_50_FEATURE_SUPPORT=TRUE
    -DCONFIG_ESP_RMAKER_SKIP_COMMON_ADDON=1
    -DCONFIG_ESP_INSIGHTS_ENABLED=0
    -DCONFIG_ESP_RMAKER_ENABLED=0
board_upload.offset_address = 0x20000
board_build.partitions = res/huge_app.csv
board_build.filesystem = littlefs
monitor_speed = 921600
lib_ignore = 
    Insights
    RainMaker
    WiFiProv
    BLE
    BluetoothSerial
custom_component_remove = 
	espressif/esp_hosted
	espressif/esp_wifi_remote
	espressif/esp-dsp
	espressif/network_provisioning
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp_rainmaker
	espressif/rmaker_common
	espressif/esp_insights
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/cbor
	espressif/qrcode
	espressif/esp-sr
	espressif/libsodium
	espressif/esp-modbus
	chmorgan/esp-libhelix-mp3
	espressif/esp32-camera
board_build.embed_txtfiles =
	res/https_server.crt
board_build.cmake_extra_args = 
	-DCONFIG_FREERTOS_HZ=1000
    -DEXCLUDE_COMPONENTS="espressif__esp_insights;espressif__esp_rainmaker;esp_insights;esp_rainmaker;RainMaker"

[env:Watchy2]
board = esp32dev
upload_speed = 921600
build_flags = 
	${env.build_flags}
	-D ARDUINO_WATCHY_V20=TRUE
	-D LITTLEFS_SPIFFS_COMPAT=1
	-D CONFIG_LITTLEFS_FOR_IDF_SPIFFS_COMPAT_MODE=y